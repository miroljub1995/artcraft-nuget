name: Update PhotoCraft

# Opens a pull request when storytold/photocraft publishes a newer release.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update eng/PhotoCraft.props
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh release view --repo storytold/photocraft --json tagName --jq .tagName)"
          latest="${latest#v}"
          current="$(sed -n 's:.*<PhotoCraftVersion>\(.*\)</PhotoCraftVersion>.*:\1:p' eng/PhotoCraft.props)"
          echo "current $current, latest $latest"
          if [ "$latest" = "$current" ]; then exit 0; fi
          eng/update-photocraft.sh "$latest"
          echo "version=$latest" >> "$GITHUB_OUTPUT"
      - name: Open pull request
        if: steps.update.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          branch="update-photocraft-$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch already exists"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Update PhotoCraft to $VERSION"
          git push -u origin "$branch"
          # A pull request opened with GITHUB_TOKEN doesn't start the CI workflow; close and reopen it
          # (or push to the branch) to run CI before merging.
          gh pr create --title "Update PhotoCraft to $VERSION" \
            --body "Release notes: https://github.com/storytold/photocraft/releases/tag/v$VERSION. Merge, then tag \`v$VERSION\` to publish."
