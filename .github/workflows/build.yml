name: Build

# Builds, tests and packs one upstream PhotoCraft version, then smoke-tests the packages on every
# platform. Called by ci.yml and release.yml; uploads the packages as packages-<version>-<revision>.

on:
  workflow_call:
    inputs:
      photocraft-version:
        description: "Upstream PhotoCraft version, e.g. 0.8.2"
        type: string
        required: true
      package-revision:
        description: "Packaging revision 1-99: 0.8.2 revision 1 is package version 0.8.201"
        type: string
        default: "1"

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PHOTOCRAFT_VERSION: ${{ inputs.photocraft-version }}
  PACKAGE_REVISION: ${{ inputs.package-revision }}

jobs:
  pack:
    name: Pack ${{ inputs.photocraft-version }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Cache upstream release archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/download/${{ inputs.photocraft-version }}
          key: photocraft-${{ inputs.photocraft-version }}
      - name: Download the PhotoCraft CLI
        run: dotnet run eng/download-cli.cs -- "$PHOTOCRAFT_VERSION"
      - run: dotnet build -c Release "-p:PackageRevision=$PACKAGE_REVISION"
      - run: dotnet test -c Release --no-build
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet pack -c Release --no-build "-p:PackageRevision=$PACKAGE_REVISION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ inputs.photocraft-version }}-${{ inputs.package-revision }}
          path: artifacts/package/release/*
          if-no-files-found: error

  smoke:
    name: Smoke test ${{ inputs.photocraft-version }} ${{ matrix.rid }}
    needs: pack
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-15, rid: osx-arm64 }
          - { os: macos-15-intel, rid: osx-x64 }
          - { os: windows-2025, rid: win-x64 }
          - { os: windows-11-arm, rid: win-arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-${{ inputs.photocraft-version }}-${{ inputs.package-revision }}
          path: artifacts/package/release
      # Reads PHOTOCRAFT_VERSION and PACKAGE_REVISION from the environment.
      - run: dotnet run eng/smoke-test.cs -- ${{ matrix.rid }}
